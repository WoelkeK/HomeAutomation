[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Zachowujemy starą wersję API Adafruit_MCP23017 używaną przez projekt.
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@1.3.0

; MySensors i Bounce2mcp muszą być dokładnie tymi samymi wersjami,
; których używała działająca kompilacja Arduino IDE.
lib_extra_dirs = lib

build_flags =
    -Wall

; Wysyłanie odbywa się przez Raspberry Pi i updateMega.sh,
; dlatego lokalny upload_port nie jest ustawiony.
